# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Gradle performance and parallel execution flags
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Optional: Uncomment if all plugins/dependencies support configuration caching
# org.gradle.configuration-cache=true

# JVM arguments capped at 4GB with Parallel GC n stuff
org.gradle.jvmargs= -Xmx4096M -XX:+UseParallelGC -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=512m

android.nonTransitiveRClass=false