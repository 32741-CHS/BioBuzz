repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://mymaven.bylazar.com/releases' }
    maven { url = 'https://repo.dairy.foundation/releases' }
}

dependencies {

    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // FtcAutoTune source is vendored directly into
    // TeamCode/src/main/java/org/firstinspires/ftc/teamcode/pidautotuner/
    // (see https://github.com/aaravdhawan25/FtcAutoTune), so no JitPack
    // dependency is needed here. If you'd rather pull it as a binary
    // dependency instead, remove the vendored 'pidautotuner' package and
    // uncomment the lines below (requires the JitPack repo block above).
    // implementation 'com.github.aaravdhawan25.FtcAutoTune:pidautotuner-core:v0.1.1'
    // implementation 'com.github.aaravdhawan25.FtcAutoTune:pidautotuner-ftc:v0.1.1'

    // Stuff For Panels -- Eric
    // Updated and safe. Note, no sloth version of panels because panels
    // is now sloth ready.
    implementation 'com.bylazar:fullpanels:1.0.18'
//    implementation 'com.bylazar:camerastream:1.0.2'

    // Stuff for pedro pathing
    implementation 'com.pedropathing:tuning:1.0.3'
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing.ivy:pedro:1.1.1'

    // Sloth hot reload
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.2'
}

